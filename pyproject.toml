[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pyflakes + syntax errors only: unused imports/names, undefined names,
# genuine bugs. Deliberately narrower than ruff's stylistic rule sets (e.g.
# E701 multiple-statements-on-one-line), which would flag this codebase's
# existing condensed if/elif style (see rules.py's castling-rights table)
# as violations even though it's an intentional readability choice, not a bug.
select = ["E9", "F"]
